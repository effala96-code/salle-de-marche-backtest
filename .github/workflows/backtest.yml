name: Backtest automatique

on:
  schedule:
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest-automatique
  cancel-in-progress: false

jobs:
  executer-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dependances
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Enregistrer le noyau Jupyter
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Executer les tests
        working-directory: src
        run: python -m unittest test_backtest.py

      - name: Executer les backtests du notebook
        env:
          MPLBACKEND: Agg
          BACKTEST_TICKER: ${{ vars.BACKTEST_TICKER || 'AI.PA' }}
          BACKTEST_SHORT_WINDOW: ${{ vars.BACKTEST_SHORT_WINDOW || '20' }}
          BACKTEST_LONG_WINDOW: ${{ vars.BACKTEST_LONG_WINDOW || '50' }}
          BACKTEST_TRANSACTION_COST: ${{ vars.BACKTEST_TRANSACTION_COST || '0.001' }}
          BACKTEST_PERIOD_1_NAME: ${{ vars.BACKTEST_PERIOD_1_NAME || '2018-2020' }}
          BACKTEST_PERIOD_1_START: ${{ vars.BACKTEST_PERIOD_1_START || '2018-01-01' }}
          BACKTEST_PERIOD_1_END: ${{ vars.BACKTEST_PERIOD_1_END || '2021-01-01' }}
          BACKTEST_PERIOD_2_NAME: ${{ vars.BACKTEST_PERIOD_2_NAME || '2021-2023' }}
          BACKTEST_PERIOD_2_START: ${{ vars.BACKTEST_PERIOD_2_START || '2021-01-01' }}
          BACKTEST_PERIOD_2_END: ${{ vars.BACKTEST_PERIOD_2_END || '2024-01-01' }}
          BACKTEST_PERIOD_3_NAME: ${{ vars.BACKTEST_PERIOD_3_NAME || '2024-a-aujourd-hui' }}
          BACKTEST_PERIOD_3_START: ${{ vars.BACKTEST_PERIOD_3_START || '2024-01-01' }}
          BACKTEST_PERIOD_3_END: ${{ vars.BACKTEST_PERIOD_3_END }}
        run: python -m papermill src/notebooks/notebooks.ipynb src/notebooks/notebooks_execute.ipynb

      - name: Archiver les resultats
        uses: actions/upload-artifact@v4
        with:
          name: resultats-backtest
          path: |
            backtest/
            src/notebooks/notebooks_execute.ipynb
          if-no-files-found: error
          retention-days: 30

      - name: Enregistrer les resultats generes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest
          if git diff --cached --quiet; then
            echo "Aucun nouveau resultat a enregistrer."
          else
            git commit \
              -m "Automatiser les resultats des backtests" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
