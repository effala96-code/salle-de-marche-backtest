name: Backtest automatique

on:
  schedule:
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest-automatique
  cancel-in-progress: false

jobs:
  executer-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dependances
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Executer les tests
        working-directory: src
        run: python -m unittest test_backtest.py

      - name: Executer le backtest
        env:
          MPLBACKEND: Agg
        run: python src/main.py

      - name: Archiver les resultats
        uses: actions/upload-artifact@v4
        with:
          name: resultats-backtest
          path: src/results/
          if-no-files-found: error
          retention-days: 30

      - name: Enregistrer le graphique genere
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/results
          if git diff --cached --quiet; then
            echo "Aucun nouveau graphique a enregistrer."
          else
            git commit \
              -m "Automatiser les resultats du backtest" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
